<body>
  <div class="container">
    <form action="">
      <fieldset>
        <legend><h1 class="title">I want YOU!</h1></legend>

        <div>
          <label for="user-name" class="required-st txt-st">이름</label>
          <input type="text" name="user-name" id="user-name" required>
        </div>

        <div>
          <label for="user-age" class="required-st txt-st">나이</label>
          <input
            type="number"
            name="user-age"
            id="user-age"
            minlength="20"
            required
          >
        </div>

        <div>
          <span class="required-st txt-st">성별</span>
          <input type="radio" name="user-gender" id="man" required>
          <label for="man" class="txt-st">남자</label>
          <input type="radio" name="user-gender" id="woman" required>
          <label for="woman" class="txt-st">여자</label>
        </div>

        <div>
          <label for="request-memo" class="txt-st">요청사항</label>
          <textarea
            name="request-memo"
            id="request-memo"
            cols="30"
            rows="10"
            placeholder="요청 사항 입력"
          ></textarea>
        </div>
